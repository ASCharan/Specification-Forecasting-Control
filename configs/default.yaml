# Reference configuration. Every value here matches the Methods section.
data:
  cities: [Delhi, Mumbai, Kolkata]
  min_stations_per_hour: 5
  aqi_clip: [0, 1000]
  max_interpolated_gap_hours: 3
  split: [0.6, 0.2, 0.2]
  lags: [1, 2, 3, 24]        # indexed from prediction time; lag 1 = series[t]
  lag_offset: 1              # NEVER vary within a comparison (see S1)
  align_test_rows: true      # score every model on the sequence-reachable rows

forecasting:
  optimiser: adam
  lr: 1.0e-3
  batch_size: 64
  max_epochs: 100
  early_stopping_patience: 10
  window_hours: 24           # sequence models only
  seeds_h1: [0, 1, 2]
  seeds_h24: [0, 1, 2, 3, 4]

cmod:
  latent_dim: 32
  hidden_dim: 64
  solver: rk4
  solver_steps: 4            # step size 0.25 over t in [0, 1]

control:
  episode_hours: 168         # SIMULATED hours per episode (one week), not compute
  training_episodes: 300
  eval_episodes: 50
  seeds: [0, 1, 2]
  ppo:
    lr: 3.0e-4
    clip_eps: 0.2
    gamma: 0.99
    gae_lambda: 0.95
    value_coef: 0.5
    entropy_coef: 0.01
    max_grad_norm: 0.5
    minibatch: 64
    epochs_per_update: 10
  reward_weights: [0.8, 0.3, 0.05, 0.1, 0.15]
  dispersion_closure: exp    # or: saturating
